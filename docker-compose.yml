services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: HomeCareDB
    hostname: homecare-db
    ports:
      - "1433:1433"
    expose:
      - "1433"
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - homecare-network
    environment:
      SA_PASSWORD: "HomeCare2025"
      ACCEPT_EULA: "Y"
      MSSQL_AGENT_ENABLED: "true"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: HomeCareAPI
    hostname: homecare-api
    ports:
      - "3006:3006"
    expose:
      - "3006"
    networks:
      - homecare-network
    environment:
      NODE_ENV: "development"
      PORT: "3006"
      DB_SERVER: "homecare-db"
      DB_PORT: "1433"
      DB_USER: "sa"
      DB_PASSWORD: "HomeCare2025"
      DB_NAME: "HomeCare"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://lgtm:4317"
    depends_on:
      - mssql
      - lgtm
    restart: unless-stopped

  lgtm:
    image: grafana/otel-lgtm:latest
    container_name: LGTM
    hostname: lgtm
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - lgtm_data:/data
    networks:
      - homecare-network
    restart: unless-stopped

volumes:
  mssql_data:
  lgtm_data:

networks:
  homecare-network:
    driver: bridge