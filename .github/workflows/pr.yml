name: PR Pipeline

on:
  pull_request:
    branches: [ main ]

jobs:
  nestjs-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' 
          cache: 'npm'       

      - name: Install dependencies
        run: npm ci         

      - name: Build application
        run: npm run build

      - name: Run Unit Tests
        run: npm run test