name: PR Pipeline

on:
  pull_request:
    branches: [ main ]

jobs:
  nestjs-validation:
    runs-on: ubuntu-latest 

    steps:
      - name: Download code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Node version
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: pnpm install

      - name: Build TypeScript
        run: pnpm build

      - name: Tests
        run: pnpm test